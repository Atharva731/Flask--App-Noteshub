<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotesHub</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">

    <h1>📝 NotesHub</h1>

    <form action="/add" method="POST">

        <input
            type="text"
            name="title"
            placeholder="Enter note title"
            required>

        <textarea
            name="content"
            placeholder="Write your note..."
            rows="5"
            required></textarea>

        <button type="submit">Save Note</button>

    </form>

    <hr>

    <h2>My Notes</h2>

    {% if notes %}
        {% for note in notes %}

<div class="note">
    <h3>{{ note[1] }}</h3>
    <p>{{ note[2] }}</p>

<a href="/edit/{{ note[0] }}">
    Edit
</a>

<a href="/delete/{{ note[0] }}">
    Delete

</a>
</div>

        {% endfor %}
    {% else %}

        <p>No notes added yet.</p>

    {% endif %}

</div>

</body>
</html>
