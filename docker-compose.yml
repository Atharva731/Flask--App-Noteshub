services:

  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: your_root_password
      MYSQL_DATABASE: noteshub
      MYSQL_USER: noteshub
      MYSQL_PASSWORD: your_database_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - noteshub-network

  app:
    build: .
    image: noteshub:latest
    ports:
      - "5000:5000"
    depends_on:
      - mysql
    environment:
      MYSQL_HOST: mysql
      MYSQL_USER: noteshub
      MYSQL_PASSWORD: _password
      MYSQL_DB: noteshub
    networks:
      - noteshub-network

volumes:
  mysql-data:

networks:
  noteshub-network:
